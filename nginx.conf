server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Friendly Aliases for Club T.I.A. (with and without hyphen)
    location = /clubtia {
        return 301 /club-tia/;
    }

    location ^~ /clubtia/ {
        return 301 /club-tia/;
    }

    location = /tia {
        return 301 /club-tia/;
    }

    location ^~ /tia/ {
        return 301 /club-tia/;
    }

    # Club T.I.A. (Colegio Monte Carmelo - Laravel 12 on Port 8093)
    location = /club-tia {
        return 301 /club-tia/;
    }

    location ^~ /club-tia/ {
        proxy_pass http://172.17.0.1:8093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /club-tia;
        proxy_redirect http://172.17.0.1:8093/ /club-tia/;
        proxy_redirect / /club-tia/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
