server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Friendly Aliases for Club T.I.A. (with and without hyphen)
    location = /clubtia {
        return 301 /club-tia/;
    }

    location ^~ /clubtia/ {
        return 301 /club-tia/;
    }

    location = /tia {
        return 301 /club-tia/;
    }

    location ^~ /tia/ {
        return 301 /club-tia/;
    }

    # Club T.I.A. (Colegio Monte Carmelo - Laravel 12 on Port 8093)
    location = /club-tia {
        return 301 /club-tia/;
    }

    location ^~ /club-tia/ {
        proxy_pass http://172.17.0.1:8093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /club-tia;
        proxy_redirect http://172.17.0.1:8093/ /club-tia/;
        proxy_redirect / /club-tia/;
    }

    # Friendly Aliases for UGMA Diplomado en Gerencia de Obras
    location = /ugma {
        return 301 /ugma-gerencia-obras/;
    }

    location = /bim {
        return 301 /ugma-gerencia-obras/unidad-1-bim;
    }

    # UGMA Diplomado en Gerencia de Obras (Laravel 12 Container on Port 8101)
    location = /ugma-gerencia-obras {
        return 301 /ugma-gerencia-obras/;
    }

    location ^~ /ugma-gerencia-obras/ {
        proxy_pass http://172.17.0.1:8101/ugma-gerencia-obras/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http://172.17.0.1:8101/ugma-gerencia-obras/ /ugma-gerencia-obras/;
        proxy_redirect / /ugma-gerencia-obras/;
    }

    # Friendly Aliases for Matemáticas Recreativas
    location = /matematicas {
        return 301 /matematicas/;
    }

    location = /matematica {
        return 301 /matematicas/;
    }

    location ^~ /matematica/ {
        return 301 /matematicas/;
    }

    location = /canguro {
        return 301 /matematicas/;
    }

    location ^~ /canguro/ {
        return 301 /matematicas/;
    }

    location = /matematicas-recreativas {
        return 301 /matematicas/;
    }

    location ^~ /matematicas-recreativas/ {
        return 301 /matematicas/;
    }

    # Matemáticas Recreativas & Gimnasia Mental (Laravel 12 Container on Port 8105)
    location ^~ /matematicas/ {
        proxy_pass http://172.17.0.1:8105/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /matematicas;
        proxy_redirect http://172.17.0.1:8105/ /matematicas/;
        proxy_redirect / /matematicas/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
